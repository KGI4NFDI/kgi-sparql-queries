# where each knowledge graph publishes its example queries
# a source is an HTML page with the queries in pre or textarea elements,
# with format: wikitext a wiki page with the queries in SPARQL templates,
# or with format: pinned a query set written by a script in scripts/ and kept by the harvest;
# endpoint is the SPARQL endpoint the source publishes its queries for, from the KGI registry
# (kgi-interop-monitor's snapshot), with the SPARQL path where the registry names a query UI
sources:
  - id: KGR69
    name: Wikidata
    namespace: examples
    domain: wikidata.org
    graph: wikidata
    format: wikitext
    url: https://www.wikidata.org/wiki/Wikidata:SPARQL_query_service/queries/examples
    endpoint: https://query.wikidata.org/sparql
