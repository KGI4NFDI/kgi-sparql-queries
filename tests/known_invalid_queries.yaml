# the queries in query-sets/ that snapquery's SPARQL parser rejects, grouped by cause (#21)
# tests/test_query_sets.py fails for an invalid query that is not listed here,
# and for a listed query that has become valid or has left its query set
harvest-truncated:
  description: "cut off mid-query; snapquery's extractor keeps only the first template argument, so the text probably ends at a |"
  queries:
    - ancestors-of-willem-alexander-of-the-netherlands--examples@wikidata.org
    - books-or-literary-works-published-before-1830-with-place-of-publication-or-narrative-location-coordinates--examples@wikidata.org
    - canadian-subjects-with-no-english-article-in-wikipedia--examples@wikidata.org
    - find-drugs-for-cancers-that-target-genes-related-to-cell-proliferation--examples@wikidata.org
    - french-heads-of-government-by-length-of-service--examples@wikidata.org
    - humans-who-died-on-a-specific-date-on-the-english-wikipedia-ordered-by-label--examples@wikidata.org
    - images-of-organic-acids--examples@wikidata.org
    - number-of-ministers-who-are-themselves-children-of-a-minister-per-country--examples@wikidata.org
    - people-born-in-lisbon-without-articles-on-ptwiki-but-with-articles-on-other-wikipedias--examples@wikidata.org
    - un-member-states--examples@wikidata.org
    - winners-of-the-2024-summer-olympics--examples@wikidata.org
harvest-markup:
  description: "wiki markup in the text: {{!}}, {{int:…}}, <translate> text outside a comment, an HTML comment"
  queries:
    - cats--examples@wikidata.org
    - former-capitals--examples@wikidata.org
    - glaciers-map--examples@wikidata.org
    - how-many-musicians-died-at-a-certain-age--examples@wikidata.org
    - list-of-countries-in-1754--examples@wikidata.org
    - most-used-properties--examples@wikidata.org
    - paintings-by-rembrandt-in-the-louvre-or-the-rijkmuseum--examples@wikidata.org
    - places-that-are-below-10-meters-above-sea-level--examples@wikidata.org
harvest-empty:
  description: "empty, or just true"
  queries:
    - academy-award-data--examples@wikidata.org
    - scholarly-articles-with-zika-in-the-item-label--examples@wikidata.org
    - scientific-articles-that-have-subject-zika-virus-or-fever-and-that-are-used-as-a-reference-in-another-item--examples@wikidata.org
