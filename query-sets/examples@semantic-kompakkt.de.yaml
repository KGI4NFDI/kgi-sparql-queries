queries:
- name: Overview of all classes and their subclasses
  namespace: examples
  domain: semantic-kompakkt.de
  query_id: overview-of-all-classes-and-their-subclasses--examples@semantic-kompakkt.de
  sparql: "\n\n#defaultView:Graph \n\nSELECT Distinct ?classes ?classesLabel ?subclasses\
    \ ?subclassesLabel  WHERE {\n  SERVICE wikibase:label { bd:serviceParam wikibase:language\
    \ \"[AUTO_LANGUAGE],en\". }\n  \n  {?classes owl:equivalentClass ?x.} Union\n\
    \  {?subclasses tibt:P2 ?classes.}\n}\n"
  url: https://wikibase.semantic-kompakkt.de/wiki/Query/Examples#Overview_of_all_classes_and_their_subclasses
  title: Overview of all classes and their subclasses
  description: ''
- name: Overview of types of of human-made objects and instances
  namespace: examples
  domain: semantic-kompakkt.de
  query_id: overview-of-types-of-of-human-made-objects-and-instances--examples@semantic-kompakkt.de
  sparql: "\n\n#defaultView:Tree\n\nSELECT ?class ?classLabel ?type ?typeLabel ?item\
    \ ?itemLabel\nWHERE\n{  \n  VALUES ?class {tib:Q6}\n  ?item tibt:P1 ?class.\n\
    \  ?item tibt:P97 ?type.\n  SERVICE wikibase:label { bd:serviceParam wikibase:language\
    \ \"[AUTO_LANGUAGE],en\". }\n}\n\n"
  url: https://wikibase.semantic-kompakkt.de/wiki/Query/Examples#Overview_of_types_of_of_human-made_objects_and_instances
  title: Overview of types of of human-made objects and instances
  description: ''
