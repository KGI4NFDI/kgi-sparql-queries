  namespace: d3.1
  domain: kgi.services.base4nfdi.de
  query_id: q4--d3.1@kgi.services.base4nfdi.de
  sparql: |-
    # Get a description of a given resource.
    DESCRIBE <URI>
  url: https://zenodo.org/records/15780729/files/D3.1%20Best%20practices%20and%20guidelines%20for%20metadata%20mapping,%20linking,%20and%20integration.pdf#page=16
