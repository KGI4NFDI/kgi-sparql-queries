domain: kgi.services.base4nfdi.de
namespace: d3.1
target_graph_name: kgi-registry
queries:
- name: Q1
  namespace: d3.1
  domain: kgi.services.base4nfdi.de
  query_id: q1--d3.1@kgi.services.base4nfdi.de
  sparql: |-
    # Query lists all KGs included in the KGI registry.
    PREFIX dcat: <http://www.w3.org/ns/dcat#>
    PREFIX dcterms: <http://purl.org/dc/terms/>
    PREFIX rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>
    SELECT ?title ?publisher ?landing_page_url
    WHERE {
      # Retrieves basic dataset metadata
      ?dataset rdf:type dcat:Dataset .
      ?dataset dcterms:title ?title .
      ?dataset dcterms:publisher ?publisher .
      ?dataset dcat:landingPage ?landing_page_url .
      # Optional: retrieves description
      OPTIONAL { ?dataset dcterms:description ?description .}
        # Optional: retrieves URL of SPARQL endpoint
      OPTIONAL {?dataset dcat:endpointURL ?kg_endpoint .}
    }
  url: https://zenodo.org/records/15780729/files/D3.1%20Best%20practices%20and%20guidelines%20for%20metadata%20mapping,%20linking,%20and%20integration.pdf#page=13
  title: Q1
  description: ''
- name: Q2
  namespace: d3.1
  domain: kgi.services.base4nfdi.de
  query_id: q2--d3.1@kgi.services.base4nfdi.de
  sparql: |-
    # Query retrieves the total number of triples in a KG
    SELECT (COUNT(*) AS ?number_of_triples)
    WHERE {
      ?subject ?predicate ?object .
    }
  url: https://zenodo.org/records/15780729/files/D3.1%20Best%20practices%20and%20guidelines%20for%20metadata%20mapping,%20linking,%20and%20integration.pdf#page=14
  title: Q2
  description: ''
- name: Q3
  namespace: d3.1
  domain: kgi.services.base4nfdi.de
  query_id: q3--d3.1@kgi.services.base4nfdi.de
  sparql: |-
    # Get a sample of triples in the KG
    SELECT *
    WHERE {
      ?subject ?predicate ?object.
    }
    LIMIT 100
  url: https://zenodo.org/records/15780729/files/D3.1%20Best%20practices%20and%20guidelines%20for%20metadata%20mapping,%20linking,%20and%20integration.pdf#page=15
  title: Q3
  description: ''
