queries:
- name: Listing 1.1
  namespace: d3.1-stories
  domain: kgi.services.base4nfdi.de
  query_id: listing-1-1--d3.1-stories@kgi.services.base4nfdi.de
  sparql: |-
    # The number of entities represented of type “bioinformatics” in Wikidata
    SELECT (COUNT(?res) AS ?total_instances)
    WHERE {
      ?res wdt:P31 wd:Q128570 .
    }
