domain: data.gesis.org
namespace: questionfeaturessample
target_graph_name: questionfeaturessample
queries:
- name: Example queries 1
  namespace: questionfeaturessample
  domain: data.gesis.org
  query_id: example-queries-1--questionfeaturessample@data.gesis.org
  sparql: |-
    PREFIX disco: <http://rdf-vocabulary.ddialliance.org/discovery#>
    PREFIX skos: <http://www.w3/2004/02/skos/core#>
    PREFIX qf: <http://data.gesis.org/questionfeatures#>
    PREFIX dct: <http://purl.org/dc/terms/>

    SELECT ?qt ?inf_type WHERE
    {
        ?study a disco:Study .
        ?study skos:prefLabel "ZA2493" .
        ?study disco:variable ?var .
        ?var disco:question ?quest .
        ?quest disco:questionText ?qt .
        ?quest qf:conceptualQuestion [
            qf:problem [
                qf:informationType ?inf_type
            ]
        ]
    }
  url: https://data.gesis.org/questionfeaturessample
  title: Example queries 1
  description: ''
- name: Example queries 2
  namespace: questionfeaturessample
  domain: data.gesis.org
