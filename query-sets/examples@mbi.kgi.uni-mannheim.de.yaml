- name: Properties with labels, aliases, descriptions and datatypes
  namespace: examples
  domain: mbi.kgi.uni-mannheim.de
  query_id: properties-with-labels-aliases-descriptions-and-datatypes--examples@mbi.kgi.uni-mannheim.de
  sparql: |2

    SELECT DISTINCT ?propertyWikibase ?propertyLabel ?propertyAlias ?propertyDescription ?propertyType WHERE {
      ?propertyWikibase wikibase:directClaim ?p;
        wikibase:propertyType ?propertyType;
        schema:description ?propertyDescription;
        rdfs:label ?propertyLabel.
      OPTIONAL { ?propertyWikibase skos:altLabel ?propertyAlias. }
    }
  url: https://mbi.kgi.uni-mannheim.de/wiki/SPARQL_examples#Properties_with_labels,_aliases,_descriptions_and_datatypes
  title: Properties with labels, aliases, descriptions and datatypes
  description: ''
- name: Properties with non-capitalized labels and their datatypes
  namespace: examples
  domain: mbi.kgi.uni-mannheim.de
  query_id: properties-with-non-capitalized-labels-and-their-datatypes--examples@mbi.kgi.uni-mannheim.de
  sparql: |2

    SELECT DISTINCT ?propertyWikibase ?propertyLabel ?propertyType WHERE {
      ?propertyWikibase wikibase:directClaim ?p;
        wikibase:propertyType ?propertyType;
        rdfs:label ?propertyLabel.
      FILTER(REGEX(?propertyLabel, "[a-z].+"))
      OPTIONAL { ?propertyWikibase skos:altLabel ?propertyAlias. }
    }
  url: https://mbi.kgi.uni-mannheim.de/wiki/SPARQL_examples#Properties_with_non-capitalized_labels_and_their_datatypes
  title: Properties with non-capitalized labels and their datatypes
  description: ''
- name: Properties with capitalized labels and their datatypes
  namespace: examples
  domain: mbi.kgi.uni-mannheim.de
  query_id: properties-with-capitalized-labels-and-their-datatypes--examples@mbi.kgi.uni-mannheim.de
  sparql: |2

    SELECT DISTINCT ?propertyWikibase ?propertyLabel ?propertyType WHERE {
      ?propertyWikibase wikibase:directClaim ?p;
        wikibase:propertyType ?propertyType;
        rdfs:label ?propertyLabel.
      FILTER(!REGEX(?propertyLabel, "[a-z].+"))
      OPTIONAL { ?propertyWikibase skos:altLabel ?propertyAlias. }
    }
  url: https://mbi.kgi.uni-mannheim.de/wiki/SPARQL_examples#Properties_with_capitalized_labels_and_their_datatypes
  title: Properties with capitalized labels and their datatypes
  description: ''
- name: Companies in MBI-KG with the labels identical to aliases of companies at Wikidata
  namespace: examples
  domain: mbi.kgi.uni-mannheim.de
  query_id: companies-in-mbi-kg-with-the-labels-identical-to-aliases-of-companies-at-wikidata--examples@mbi.kgi.uni-mannheim.de
  sparql: |2

    PREFIX wd-wd: <http://www.wikidata.org/entity/>
    PREFIX wd-wdt: <http://www.wikidata.org/prop/direct/>
    SELECT DISTINCT ?MBI_company ?MBI_companyLabel ?WD_company ?WD_companyLabel WHERE {
      ?MBI_company rdfs:label ?MBI_companyLabel;
        wdt:P3 wd:Q1.
      FILTER((LANG(?MBI_companyLabel)) = "de")
      SERVICE <https://query.wikidata.org/sparql> {
        ?WD_company rdfs:label ?WD_companyLabel;
          skos:altLabel ?MBI_companyLabel;
          wd-wdt:P452 ?industry;
          wd-wdt:P17 wd-wd:Q183.
        FILTER((LANG(?WD_companyLabel)) = "de")
      }
    }
  url: https://mbi.kgi.uni-mannheim.de/wiki/SPARQL_examples#Companies_in_MBI-KG_with_the_labels_identical_to_aliases_of_companies_at_Wikidata
  title: Companies in MBI-KG with the labels identical to aliases of companies at
    Wikidata
  description: ''
- name: MBI-KG-companies and AKF-KG-companies with identical labels
  namespace: examples
  domain: mbi.kgi.uni-mannheim.de
  query_id: mbi-kg-companies-and-akf-kg-companies-with-identical-labels--examples@mbi.kgi.uni-mannheim.de
  sparql: |2

    PREFIX akfd: <http://akf.kgi.uni-mannheim.de/entity/>
    PREFIX akfdt: <http://akf.kgi.uni-mannheim.de/prop/direct/>
    SELECT DISTINCT ?MBI_company ?MBI_companyLabel ?AKF_company ?AKF_companyLabel WHERE {
      ?MBI_company rdfs:label ?MBI_companyLabel;
        wdt:P3 wd:Q1.
      FILTER((LANG(?MBI_companyLabel)) = "de")
      SERVICE <https://query.akf.kgi.uni-mannheim.de/proxy/wdqs/bigdata/namespace/wdq/sparql> {
        ?AKF_company rdfs:label ?AKF_companyLabel;
          akfdt:P346 ?MBI_companyLabel;
          akfdt:P325 akfd:Q1.
        FILTER((LANG(?AKF_companyLabel)) = "de")
      }
    }
  url: https://mbi.kgi.uni-mannheim.de/wiki/SPARQL_examples#MBI-KG-companies_and_AKF-KG-companies_with_identical_labels
  title: MBI-KG-companies and AKF-KG-companies with identical labels
  description: ''
