- name: Companies with labels, Postscheckkonto, Fernruf, Drahtanschrift and inception
    in time interval 1905-1910
  namespace: examples
  domain: mbi.kgi.uni-mannheim.de
  query_id: companies-with-labels-postscheckkonto-fernruf-drahtanschrift-and-inception-in-time-interval-1905-1910--examples@mbi.kgi.uni-mannheim.de
  sparql: |2

    SELECT DISTINCT ?company ?companyLabel (YEAR(?inc) AS ?inception) ?POSTSCHECKKONTO ?FERNRUF ?DRAHTANSCHRIFT WHERE {
      ?company rdfs:label ?companyLabel;
        wdt:P3 wd:Q1.
      OPTIONAL { ?company wdt:P46 ?inc. }
      FILTER(?inc >= "1905-01-01T00:00:00Z"^^xsd:dateTime)
      FILTER(?inc <= "1910-01-01T00:00:00Z"^^xsd:dateTime)
      OPTIONAL { ?company wdt:P7 ?POSTSCHECKKONTO. }
      OPTIONAL { ?company wdt:P8 ?FERNRUF. }
      OPTIONAL { ?company wdt:P9 ?DRAHTANSCHRIFT. }
      FILTER((LANG(?companyLabel)) = "de")
    }
  url: https://mbi.kgi.uni-mannheim.de/wiki/SPARQL_examples#Companies_with_labels,_Postscheckkonto,_Fernruf,_Drahtanschrift_and_inception_in_time_interval_1905-1910
  title: Companies with labels, Postscheckkonto, Fernruf, Drahtanschrift and inception
    in time interval 1905-1910
  description: ''
- name: Map with headquarters of companies
  namespace: examples
  domain: mbi.kgi.uni-mannheim.de
  query_id: map-with-headquarters-of-companies--examples@mbi.kgi.uni-mannheim.de
  sparql: |2

    #defaultView:Map
    SELECT DISTINCT ?item ?itemLabel ?city ?cityLabel ?geo WHERE {
      ?item wdt:P3 wd:Q1;
        wdt:P48 ?city.
      ?city wdt:P3 wd:Q5157;
        wdt:P50 ?geo.
      SERVICE wikibase:label { bd:serviceParam wikibase:language "de". }
    }
  url: https://mbi.kgi.uni-mannheim.de/wiki/SPARQL_examples#Map_with_headquarters_of_companies
  title: Map with headquarters of companies
  description: ''
