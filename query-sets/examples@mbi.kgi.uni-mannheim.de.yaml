domain: mbi.kgi.uni-mannheim.de
namespace: examples
target_graph_name: mbi
queries:
- name: Companies with labels, inception, Postscheckkonto, Fernruf and Drahtanschrift
  namespace: examples
  domain: mbi.kgi.uni-mannheim.de
  query_id: companies-with-labels-inception-postscheckkonto-fernruf-and-drahtanschrift--examples@mbi.kgi.uni-mannheim.de
  sparql: |2

    SELECT DISTINCT ?company ?companyLabel (year(?inc) as ?inception) ?POSTSCHECKKONTO ?FERNRUF ?DRAHTANSCHRIFT WHERE {
      ?company rdfs:label ?companyLabel;
        wdt:P3 wd:Q1.
      OPTIONAL { ?company wdt:P46 ?inc. }
      OPTIONAL { ?company wdt:P7 ?POSTSCHECKKONTO. }
      OPTIONAL { ?company wdt:P8 ?FERNRUF. }
      OPTIONAL { ?company wdt:P9 ?DRAHTANSCHRIFT. }
      FILTER((LANG(?companyLabel)) = "de")
    }
  url: https://mbi.kgi.uni-mannheim.de/wiki/SPARQL_examples#Companies_with_labels,_inception,_Postscheckkonto,_Fernruf_and_Drahtanschrift
  title: Companies with labels, inception, Postscheckkonto, Fernruf and Drahtanschrift
  description: ''
